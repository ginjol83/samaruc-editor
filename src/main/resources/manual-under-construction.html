<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Manual en construccion</title>
    <style>
        :root {
            color-scheme: light dark;
        }
        body {
            margin: 0;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            font-family: Segoe UI, Arial, sans-serif;
            background: #0f172a;
            color: #e2e8f0;
        }
        .card {
            max-width: 680px;
            margin: 24px;
            padding: 28px;
            border-radius: 12px;
            background: #111827;
            border: 1px solid #334155;
            box-shadow: 0 8px 30px rgba(0, 0, 0, 0.35);
            text-align: center;
        }
        h1 {
            margin-top: 0;
            color: #f8fafc;
        }
        p {
            line-height: 1.6;
            margin: 10px 0;
            color: #cbd5e1;
        }
        .muted {
            color: #94a3b8;
            font-size: 0.95rem;
        }
    </style>
</head>
<body>
    <main class="card">
        <h1>Manual en construccion</h1>
        <p>Esta seccion del manual esta temporalmente deshabilitada.</p>
        <p>Estamos trabajando para publicar una version actualizada pronto.</p>
        <p class="muted">Gracias por tu paciencia.</p>
    </main>
</body>
</html>
