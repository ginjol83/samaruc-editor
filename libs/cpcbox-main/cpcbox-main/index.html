	<script type="text/javascript">
		$(document).ready(function() {
			var searchParams = new URLSearchParams(window.location.search);
			var skipDefaultAutostart = searchParams.get('samaruc_autostart') === '0';
			if (!skipDefaultAutostart && typeof AUTO_START_ENABLED !== 'undefined' && AUTO_START_ENABLED) {
				// Set the dropdown to the auto-start configuration
				$('#snapshot').val(AUTO_START_CONFIG);
				
				// Update status to show auto-start is happening
				var message = (typeof AUTO_START_MESSAGE !== 'undefined') ? AUTO_START_MESSAGE : 'Auto-starting...';
				$('#status').text(message);
				
				// Auto-start after a short delay to ensure everything is loaded
				var delay = (typeof AUTO_START_DELAY !== 'undefined') ? AUTO_START_DELAY : 2000;
				setTimeout(function() {
					// Trigger the change event to start the emulator
					$('#snapshot').trigger('change');
				}, delay);
			} else {
				// If auto-start is disabled, show the normal paused status
				$('#status').text('Paused');
			}
		});
	</script>
	<script type="text/javascript">
		(function() {
			var searchParams = new URLSearchParams(window.location.search);
			var isSamarucSession = searchParams.get('samaruc_autostart') === '0';

			function setStatus(message) {
				var statusEl = document.getElementById('status');
				if (!statusEl) return;
				statusEl.style.display = isSamarucSession ? 'block' : statusEl.style.display;
				statusEl.textContent = message || '';
				if (window.console && typeof window.console.log === 'function') {
					window.console.log('[samaruc-cpc] ' + (message || ''));
				}
			}

			function safeInvoke(handler, keyCode, options) {
				if (typeof handler !== 'function') return;
				var eventOptions = options || {};
				handler({
					keyCode: keyCode,
					which: keyCode,
					shiftKey: !!eventOptions.shiftKey,
					ctrlKey: !!eventOptions.ctrlKey,
					altKey: !!eventOptions.altKey,
					preventDefault: function() {},
					stopPropagation: function() {}
				});
			}

			function focusEmulator() {
				try { window.focus(); } catch (e) {}
				try { document.body.focus(); } catch (e) {}
				try {
					var screen = document.getElementById('screen');
					if (screen) screen.focus();
				} catch (e) {}
			}

			function isKeyboardReady() {
				return !!(window.pT && pT.hj && typeof pT.iQ === 'function');
			}

			function applyMatrixKey(keyCode, pressed) {
				if (!isKeyboardReady()) return false;
				var mapped = pT.iQ(keyCode);
				if (mapped == null) return false;
				if (pressed) {
					pT.hj[mapped[0]] = pT.hj[mapped[0]] & ~mapped[1] & 255;
				} else {
					pT.hj[mapped[0]] |= mapped[1];
				}
				return true;
			}

			function dispatchDomKey(type, keyCode, options) {
				var eventOptions = options || {};
				try {
					var event;
					if (typeof KeyboardEvent === 'function') {
						event = new KeyboardEvent(type, {
							bubbles: true,
							cancelable: true,
							keyCode: keyCode,
							which: keyCode,
							shiftKey: !!eventOptions.shiftKey,
							ctrlKey: !!eventOptions.ctrlKey,
							altKey: !!eventOptions.altKey
						});
					} else {
						event = document.createEvent('Event');
						event.initEvent(type, true, true);
					}
					event.keyCode = keyCode;
					event.which = keyCode;
					event.shiftKey = !!eventOptions.shiftKey;
					event.ctrlKey = !!eventOptions.ctrlKey;
					event.altKey = !!eventOptions.altKey;
					document.dispatchEvent(event);
				} catch (e) {
				}
			}

			function resumeIfNeeded() {
				try {
					if ($('#button-run').hasClass('button') && window.qH && typeof qH.oL === 'function') {
						qH.oL();
					}
				} catch (e) {
				}
			}

			function pressMatrixKey(keyCode) {
				applyMatrixKey(keyCode, true);
			}

			function releaseMatrixKey(keyCode) {
				applyMatrixKey(keyCode, false);
			}

			function sendKeyStroke(stroke) {
				if (!stroke || stroke.keyCode == null) return;
				var keyCode = stroke.keyCode;
				var hasShift = !!stroke.shiftKey;
				var hasCtrl = !!stroke.ctrlKey;
				var hasAlt = !!stroke.altKey;
				var domOptions = {
					shiftKey: hasShift,
					ctrlKey: hasCtrl,
					altKey: hasAlt
				};

				focusEmulator();
				if (hasShift) pressMatrixKey(16);
				if (hasCtrl) pressMatrixKey(17);
				if (hasAlt) pressMatrixKey(18);

				dispatchDomKey('keydown', keyCode, domOptions);
				safeInvoke(document.onkeydown, keyCode, domOptions);
				pressMatrixKey(keyCode);
				setTimeout(function() {
					dispatchDomKey('keyup', keyCode, domOptions);
					safeInvoke(document.onkeyup, keyCode, domOptions);
					releaseMatrixKey(keyCode);
					if (hasAlt) releaseMatrixKey(18);
					if (hasCtrl) releaseMatrixKey(17);
					if (hasShift) releaseMatrixKey(16);
				}, 60);
			}

			function charToKeyStroke(ch) {
				if (!ch) return null;
				if (ch === '\n' || ch === '\r') return { keyCode: 13 };
				var upper = ch.toUpperCase();
				if (upper >= 'A' && upper <= 'Z') return { keyCode: upper.charCodeAt(0) };
				if (ch >= '0' && ch <= '9') return { keyCode: ch.charCodeAt(0) };
				if (ch === '"') return { keyCode: 50, shiftKey: true };
				if (ch === '|') return { keyCode: 220 };
				if (ch === ' ') return { keyCode: 32 };
				return null;
			}

			function sanitizeCommandForStatus(text) {
				return (text || '').replace(/\n/g, '\\n');
			}

			function normalizeCommandText(text) {
				return (text || '').replace(/\r/g, '');
			}

			function ensureTrailingEnter(text) {
				var normalized = normalizeCommandText(text);
				return /\n$/.test(normalized) ? normalized : normalized + '\n';
			}

			function scheduleCommandPhase(label, command, startDelay, keyDelay) {
				setTimeout(function() {
					setStatus(label + ': ' + sanitizeCommandForStatus(command));
					window.samarucTypeTextWhenReady(command, 0, keyDelay, 24);
				}, Math.max(0, startDelay || 0));
			}

			function queueDiskAutorun(autoCommand) {
				var normalized = normalizeCommandText(autoCommand || 'CAT\n');
				if (!normalized) normalized = 'CAT\n';

				if (normalized.indexOf('RUN"') === 0) {
					normalized = ensureTrailingEnter(normalized);
					scheduleCommandPhase('CPC disk catalogue', 'CAT\n', 2500, 150);
					scheduleCommandPhase('CPC disk autorun #1', normalized, 6500, 170);
					scheduleCommandPhase('CPC disk autorun #2', normalized, 9800, 180);
					scheduleCommandPhase('CPC disk enter retry', '\n', 12100, 130);
					return;
				}

				scheduleCommandPhase('CPC disk command', normalized, 2500, 160);
			}

			window.samarucTypeText = function(text, startDelay, keyDelay) {
				var delay = typeof startDelay === 'number' ? startDelay : 0;
				var interval = typeof keyDelay === 'number' ? keyDelay : 120;
				setStatus('Typing CPC command: ' + sanitizeCommandForStatus(text));
				for (var i = 0; i < text.length; i++) {
					(function(index) {
						var stroke = charToKeyStroke(text.charAt(index));
						if (stroke == null) return;
						setTimeout(function() { sendKeyStroke(stroke); }, delay + index * interval);
					})(i);
				}
			};

			window.samarucTypeTextWhenReady = function(text, startDelay, keyDelay, maxAttempts) {
				var initialDelay = typeof startDelay === 'number' ? startDelay : 0;
				var interval = typeof keyDelay === 'number' ? keyDelay : 120;
				var attemptsLeft = typeof maxAttempts === 'number' ? maxAttempts : 40;

				setStatus('Waiting for CPC keyboard...');
				setTimeout(function poll() {
					focusEmulator();
					resumeIfNeeded();
					if (isKeyboardReady()) {
						window.samarucTypeText(text, 0, interval);
						return;
					}
					attemptsLeft--;
					if (attemptsLeft <= 0) {
						setStatus('CPC keyboard not ready. Command skipped: ' + sanitizeCommandForStatus(text));
						return;
					}
					setTimeout(poll, 250);
				}, initialDelay);
			};

			window.samarucLoadDisk = function(fileName, byteArray, autoCommand) {
				var bytes = Uint8Array.from(byteArray || []);
				setStatus('Booting CPC disk: ' + (fileName || 'disk'));
				pG.er = null;
				pG.es = pC.cZ(bytes);
				$('#drivea-zipselect').hide();
				$('#drivea-filename').text(fileName || 'disk').show();
				$('#drivea-eject').removeClass('disabled-button').addClass('button');
				$('#floppy-option').prop('checked', true);
				$('#tape-option').prop('checked', false);
				$('input[name=firmware][value=english]').prop('checked', true);
				$('input[name=brand][value=amstrad]').prop('checked', true);
				$('#snapshot').val('boot_cpc6128');
				oU.w();
				qH.ez();
				setTimeout(resumeIfNeeded, 250);
				setTimeout(resumeIfNeeded, 900);
				queueDiskAutorun(autoCommand || 'CAT\n');
			};

			window.samarucLoadTapeWav = function(fileName, byteArray) {
				var bytes = Uint8Array.from(byteArray || []);
				setStatus('Booting CPC tape: ' + (fileName || 'tape'));
				pI.er = null;
				pI.es = pD.cZ(bytes);
				$('#tape-zipselect').hide();
				$('#tape-filename').text(fileName || 'tape').show();
				$('#tape-eject').removeClass('disabled-button').addClass('button');
				$('#tape-option').prop('checked', true);
				$('#floppy-option').prop('checked', false);
				$('input[name=firmware][value=english]').prop('checked', true);
				$('input[name=brand][value=amstrad]').prop('checked', true);
